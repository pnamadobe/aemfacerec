operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
hooks:
  post-app-build: ./hooks/post-build.js
  post-app-deploy: ./hooks/post-deploy.js
runtimeManifest:
  packages:
    aem-assets-assetsview-1:
      license: Apache-2.0
      inputs:
        LOG_LEVEL: info
        AEM_HOST: $AEM_HOST
        AEM_AUTHOR_URL: $AEM_AUTHOR_URL
        AEM_ALLOWED_HOSTS: $AEM_ALLOWED_HOSTS
        AEM_SC_JSON: $AEM_SC_JSON
        AEM_DEV_TOKEN: $AEM_DEV_TOKEN
        ENCRYPTION_SECRET: $ENCRYPTION_SECRET
        ENABLE_MAINTENANCE_OPS: $ENABLE_MAINTENANCE_OPS
      actions:
        ingest:
          function: actions/ingest/index.js
          web: 'yes'
          runtime: nodejs:22
          limits:
            timeout: 120000
            memorySize: 512
          annotations:
            # Must be false at the Runtime gateway so Adobe I/O Events GET ?challenge= verification
            # probes and webhook POST deliveries (which do not carry x-gw-ims-org-id) are not
            # rejected with 401 by adobeio/shared-validators-v1/app-registry before reaching main().
            # User IMS Bearer token auth is enforced inside buildActionContext() for all UI requests.
            require-adobe-auth: false
            provide-api-key: true
            final: true
        ingest-event:
          function: actions/ingest/index.js
          web: 'no'
          runtime: nodejs:22
          limits:
            timeout: 120000
            memorySize: 512
          annotations:
            provide-api-key: true
            final: true
        groups:
          function: actions/groups/index.js
          web: 'yes'
          runtime: nodejs:22
          limits:
            timeout: 120000
            memorySize: 512
          annotations:
            require-adobe-auth: true
            provide-api-key: true
            final: true
        settings:
          function: actions/settings/index.js
          web: 'yes'
          runtime: nodejs:22
          limits:
            timeout: 60000
            memorySize: 256
          annotations:
            require-adobe-auth: true
            provide-api-key: true
            final: true
