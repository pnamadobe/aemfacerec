operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
hooks:
  post-app-build: ./hooks/post-build.js
  post-app-deploy: ./hooks/post-deploy.js
runtimeManifest:
  packages:
    aem-assets-assetsview-1:
      license: Apache-2.0
      actions:
        ingest:
          function: actions/ingest/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: info
            AEM_HOST: $AEM_HOST
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_ALLOWED_HOSTS: $AEM_ALLOWED_HOSTS
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            ENCRYPTION_SECRET: $ENCRYPTION_SECRET
            ENABLE_MAINTENANCE_OPS: $ENABLE_MAINTENANCE_OPS
          limits:
            timeout: 120000
            memorySize: 512
          annotations:
            require-adobe-auth: false
            provide-api-key: true
            final: true
        ingest-event:
          function: actions/ingest/index.js
          web: 'no'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: info
            AEM_HOST: $AEM_HOST
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            ENCRYPTION_SECRET: $ENCRYPTION_SECRET
          limits:
            timeout: 120000
            memorySize: 512
          annotations:
            provide-api-key: true
            final: true
        groups:
          function: actions/groups/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: info
            AEM_HOST: $AEM_HOST
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_ALLOWED_HOSTS: $AEM_ALLOWED_HOSTS
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            ENCRYPTION_SECRET: $ENCRYPTION_SECRET
            ENABLE_MAINTENANCE_OPS: $ENABLE_MAINTENANCE_OPS
          limits:
            timeout: 120000
            memorySize: 512
          annotations:
            require-adobe-auth: false
            provide-api-key: true
            final: true
        settings:
          function: actions/settings/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: info
            AEM_HOST: $AEM_HOST
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_ALLOWED_HOSTS: $AEM_ALLOWED_HOSTS
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            ENCRYPTION_SECRET: $ENCRYPTION_SECRET
            ENABLE_MAINTENANCE_OPS: $ENABLE_MAINTENANCE_OPS
          limits:
            timeout: 60000
            memorySize: 256
          annotations:
            require-adobe-auth: true
            provide-api-key: true
            final: true
