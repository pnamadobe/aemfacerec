operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
hooks:
  post-app-deploy: ./hooks/post-deploy.js
runtimeManifest:
  packages:
    aem-assets-assetsview-1:
      license: Apache-2.0
      actions:
        ingest:
          function: actions/ingest/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            AEM_HOST: $AEM_HOST
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
          limits:
            timeout: 120000
            memorySize: 512
          annotations:
            require-adobe-auth: false
            provide-api-key: true
            final: true
        groups:
          function: actions/groups/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            AEM_HOST: $AEM_HOST
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
          limits:
            timeout: 120000
            memorySize: 512
          annotations:
            require-adobe-auth: false
            provide-api-key: true
            final: true
        settings:
          function: actions/settings/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            AEM_HOST: $AEM_HOST
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            ENCRYPTION_SECRET: $ENCRYPTION_SECRET
          limits:
            timeout: 60000
            memorySize: 256
          annotations:
            require-adobe-auth: false
            provide-api-key: true
            final: true
